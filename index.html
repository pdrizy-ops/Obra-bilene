<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Casa Lodge · Bilene — Controlo de Obra</title>
<meta name="description" content="Controlo de fases, materiais e custos da obra Casa Lodge, Bilene." />

<!-- PWA -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#111111" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Casa Lodge" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />

<!-- Fontes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- React + Babel + XLSX (sem passo de build — corre directamente no browser) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F2F2F4; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  input, select, button { font-family: inherit; }
  input[type=range] { accent-color: #111111; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #D4D4D8; border-radius: 8px; }
  #splash { position: fixed; inset: 0; background: #F2F2F4; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #9A9A9A; z-index: 999; }

  @media (max-width: 900px) {
    .app-sidebar { display: none !important; }
    .app-main { margin-left: 0 !important; padding: 20px 16px 90px !important; }
    .mobile-tabbar { display: flex !important; }
    .top-cards { grid-template-columns: 1fr !important; }
    .top-cards > div:first-child { grid-column: span 1 !important; }
    .home-grid, .detail-grid { grid-template-columns: 1fr !important; }
    .comp-grid { grid-template-columns: repeat(2, 1fr) !important; }
  }
  @media (max-width: 520px) {
    .comp-grid { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
  <div id="root"><div id="splash">A carregar…</div></div>

  <script type="text/babel" data-presets="react" src="./app.jsx"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
